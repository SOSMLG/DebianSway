# foot — RENDERED by the debsway theme engine (do not edit).
# Source: debsway/themes/_base/tpl/foot/foot.ini — `debsway theme set` re-renders this.
# Nerd-friendly defaults: JetBrainsMono Nerd Font (matches sway bar), scrollback
# for dev workflows, URL copy with Ctrl+Shift+o.

[main]
term=foot
# 14" 1080p: size 11 reads comfortably at arm's length (10 felt small).
font=JetBrainsMono Nerd Font:size=11
# NOTE: no `line-height` override — foot measures it in absolute points, so a
# bare `1.1` means 1.1pt rows (everything crushes into a strip at the top).
# Font metrics already size rows correctly; to add air use px, e.g. 20px.
pad=8x8
resize-by-cells=yes
# palette-based bolds: bold red renders as bright-red, not red-blended-white —
# the only correct choice for a themed 16-color palette (see foot.ini(5)).
bold-text-in-bright=palette-based
word-delimiters=,│`|:"'()[]{}<>
selection-target=primary

[scrollback]
lines=20000
multiplier=3.0
indicator-position=relative

[cursor]
style=block
blink=no
# Hollow when unfocused: you always know which foot has keyboard focus.
unfocused-style=hollow

[mouse]
hide-when-typing=yes
alternate-scroll-mode=yes

[key-bindings]
clipboard-copy=Control+Shift+c
clipboard-paste=Control+Shift+v
primary-paste=Shift+Insert
search-start=Control+Shift+f
spawn-terminal=Control+Shift+Return
fullscreen=F11

[colors]
background=1e1e2e
foreground=cdd6f4
