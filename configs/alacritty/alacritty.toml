# Window settings
[window]
padding = { x = 8, y = 8 }
opacity = 0.95
decorations = "None"
dynamic_padding = true

# Font — IosevkaTerm Nerd Font (installed by scripts/17-fonts.sh)
[font]
size = 14.0
[font.normal]
family = "IosevkaTerm Nerd Font Mono"
style = "Regular"
[font.bold]
family = "IosevkaTerm Nerd Font Mono"
style = "Bold"
[font.italic]
family = "IosevkaTerm Nerd Font Mono"
style = "Italic"
[font.bold_italic]
family = "IosevkaTerm Nerd Font Mono"
style = "Bold Italic"

# Cursor
[cursor]
style = { shape = "Block", blinking = "Never" }
vi_mode_style = { shape = "Block" }

# Color scheme — RENDERED by the debsway theme engine (do not edit)
[colors]
draw_bold_text_with_bright_colors = true
[colors.primary]
background = "0x16181d"
foreground = "0xd8d3c8"
dim_foreground = "0x9a9aa2"
bright_foreground = "0xd8d3c8"
[colors.cursor]
text = "0x16181d"
cursor = "0xe8a33d"
[colors.vi_mode_cursor]
text = "0x16181d"
cursor = "0x7e9db5"
[colors.normal]
black = "0x30343b"
red = "0xc97064"
green = "0x8fb57a"
yellow = "0xd2992f"
blue = "0x7e9db5"
magenta = "0xa78bb5"
cyan = "0x79a9a6"
white = "0xd8d3c8"
[colors.bright]
black = "0x9a9aa2"
red = "0xc97064"
green = "0x8fb57a"
yellow = "0xd2992f"
blue = "0x7e9db5"
magenta = "0xa78bb5"
cyan = "0x79a9a6"
white = "0xd8d3c8"
[colors.selection]
text = "0x16181d"
background = "0x30343b"

# Scrolling — 20k lines for dev workflows
[scrolling]
history = 20000
multiplier = 3

# Key bindings
[keyboard]
bindings = [
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Space", mods = "Control|Shift", action = "ToggleViMode" },
  { key = "F11",   mods = "None",          action = "ToggleFullscreen" },
]