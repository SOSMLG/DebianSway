# DebSway — Wayland session environment (user-level).
# Picked up by interactive shells from ~/.profile (see 20-shell-upgrade.sh).
# Keep native Wayland backends so Electron/Qt/GTK apps don't trampoline to X.
GDK_BACKEND=wayland
QT_QPA_PLATFORM=wayland
QT_QUICK_CONTROLS_STYLE=org.kde.desktop
ELECTRON_OZONE_PLATFORM_HINT=auto
MOZ_ENABLE_WAYLAND=1
XDG_CURRENT_DESKTOP=sway
XDG_SESSION_TYPE=wayland
XDG_PICTURES_DIR=$HOME/Pictures