# fuzzel — RENDERED by the debsway theme engine (do not edit).
# Source: debsway/themes/_base/tpl/fuzzel/fuzzel.ini — `debsway theme set` re-renders this.
# Flat DebSway look (square corners). `debsway launcher` uses NATIVE app mode
# (icons + correct launching built in); `--dmenu` feeds are only for the
# text menus (palette, clipboard, wifi, …), see debsway/lib/actions.sh.

[main]
terminal=foot -e
layer=overlay
width=44
lines=8
font=JetBrainsMono Nerd Font:size=11
prompt="❯ "
placeholder=Type to filter…
match-counter=yes
# App icons in the launcher (hicolor theme resolves Firefox/Thunar/mpv…).
# Default is yes; stated so `debsway launcher` icons are a promise, not luck.
icons-enabled=yes
# fzf matching is fuzzel's default; stated explicitly so learners find it.
match-mode=fzf
vertical-pad=8
inner-pad=6
show-actions=no
# NOTE: filter-desktop/fields below only govern NATIVE app mode
# ($mod+Shift+d bare `fuzzel`); debsway menus are `--dmenu` text feeds.
filter-desktop=no
fields=filename,name,generic,comment,keywords,exec
password-character=●
hide-before-typing=no

[colors]
background=1e1e2eff
text=cdd6f4ff
match=f5c2e7ff
selection=45475aff
selection-text=cdd6f4ff
selection-match=f5c2e7ff
input=cdd6f4ff
prompt=f38ba8ff
placeholder=6c7086ff
counter=6c7086ff
border=313244ff

[border]
width=2
radius=0
