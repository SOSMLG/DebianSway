# gammastep — night-light daemon config (used by `debsway toggle night`).
# Set your latitude/longitude so dusk/dawn times are automatic, or use
# fixed dawn/dusk times. Configuration format is the same as redshift.

[general]
location-provider = manual
dawn-time = 6:00-7:00
dusk-time = 18:00-19:00

[manual]
# Set your coordinates here. Find yours at https://latlong.net
# Examples: lat = 48.8566, lon = 2.3522 (Paris)
lat =
lon =

[colors]
day.temperature = 6500K
night.temperature = 4000K

[wayland]
# No extra settings needed on sway/wlroots.