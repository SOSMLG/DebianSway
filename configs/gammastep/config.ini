# gammastep — night-light daemon config (used by `debsway toggle night`).
# Set your latitude/longitude below so dusk/dawn follows the sun.
# NOTE: unlike redshift, gammastep's parser rejects spaces around '='
# — keep every setting as key=value with no spaces.
[general]
location-provider=manual
dawn-time=06:00-07:00
dusk-time=18:00-19:00

[manual]
# Your coordinates. Find yours at https://latlong.net
# Example: lat=48.8566 lon=2.3522 (Paris)
lat=
lon=

[colors]
day.temperature=6500K
night.temperature=4000K
