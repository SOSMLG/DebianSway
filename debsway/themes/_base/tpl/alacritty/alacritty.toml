# Window settings
[window]
padding = { x = 8, y = 8 }
opacity = 0.95
decorations = "None"
dynamic_padding = true

# Font — IosevkaTerm Nerd Font (installed by scripts/17-fonts.sh)
[font]
size = 14.0
[font.normal]
family = "IosevkaTerm Nerd Font Mono"
style = "Regular"
[font.bold]
family = "IosevkaTerm Nerd Font Mono"
style = "Bold"
[font.italic]
family = "IosevkaTerm Nerd Font Mono"
style = "Italic"
[font.bold_italic]
family = "IosevkaTerm Nerd Font Mono"
style = "Bold Italic"

# Cursor
[cursor]
style = { shape = "Block", blinking = "Never" }
vi_mode_style = { shape = "Block" }

# Color scheme — RENDERED by the debsway theme engine (do not edit)
[colors]
draw_bold_text_with_bright_colors = true
[colors.primary]
background = "0x@@BG@@"
foreground = "0x@@TEXT@@"
dim_foreground = "0x@@SUBTEXT0@@"
bright_foreground = "0x@@TEXT@@"
[colors.cursor]
text = "0x@@BG@@"
cursor = "0x@@ACCENT@@"
[colors.vi_mode_cursor]
text = "0x@@BG@@"
cursor = "0x@@BLUE@@"
[colors.normal]
black = "0x@@T0@@"
red = "0x@@T1@@"
green = "0x@@T2@@"
yellow = "0x@@T3@@"
blue = "0x@@T4@@"
magenta = "0x@@T5@@"
cyan = "0x@@T6@@"
white = "0x@@T7@@"
[colors.bright]
black = "0x@@TB0@@"
red = "0x@@TB1@@"
green = "0x@@TB2@@"
yellow = "0x@@TB3@@"
blue = "0x@@TB4@@"
magenta = "0x@@TB5@@"
cyan = "0x@@TB6@@"
white = "0x@@TB7@@"
[colors.selection]
text = "0x@@BG@@"
background = "0x@@SURFACE2@@"

# Scrolling — 20k lines for dev workflows
[scrolling]
history = 20000
multiplier = 3

# Key bindings
[keyboard]
bindings = [
  { key = "Return", mods = "Control|Shift", action = "SpawnNewInstance" },
  { key = "Space", mods = "Control|Shift", action = "ToggleViMode" },
  { key = "F11",   mods = "None",          action = "ToggleFullscreen" },
]