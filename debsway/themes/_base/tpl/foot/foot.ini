# foot config — RENDERED by the debsway theme engine. Do not edit; use `debsway theme`.

[main]
font=JetBrainsMono Nerd Font:size=11
dpi-aware=yes
term=xterm-256color
initial-window-size-chars=100x30
pad=8x8
bold-text-in-bright=yes
selection-target=clipboard

[cursor]
style=beam
blink=no
color=@@ACCENT@@ @@BG@@

[mouse]
hide-when-typing=yes

[url]
launch=firefox ${url}

[scrollback]
lines=10000

[colors]
background=@@BG@@
foreground=@@TEXT@@
regular0=@@T0@@
regular1=@@T1@@
regular2=@@T2@@
regular3=@@T3@@
regular4=@@T4@@
regular5=@@T5@@
regular6=@@T6@@
regular7=@@T7@@
bright0=@@TB0@@
bright1=@@TB1@@
bright2=@@TB2@@
bright3=@@TB3@@
bright4=@@TB4@@
bright5=@@TB5@@
bright6=@@TB6@@
bright7=@@TB7@@
selection-background=@@SURFACE2@@
selection-foreground=@@CRUST@@
jump-labels=@@ACCENT@@ @@BG@@
scrollback-indicator=@@ACCENT@@ @@TEXT@@
search-box-no-match=@@RED@@ @@TEXT@@
search-box-match=@@ACCENT@@ @@TEXT@@
urls=@@BLUE@@